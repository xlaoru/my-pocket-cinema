<header>
    <a href="/">
        <h3>My Pocket Cinema</h3>
    </a>
    <div class="search-wrapper">
        <app-input 
            [placeholder]="'Search by title'"
            [(value)]="searchValue"
        />
        <app-button
        >
            Search
        </app-button>
    </div>
    <app-tabs
        [items]="headerTabs"
        [activeTab]="activeTab()"
        (tabChanged)="onTabChanged($event)"
    />
</header>
