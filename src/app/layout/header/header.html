<header>
    <a routerLink="/">
        <h3>My Pocket Cinema</h3>
    </a>
    <form
        (submit)="onSearch($event)"
    >
        <app-input 
            [placeholder]="'Search by title'"
            [(value)]="searchValue"
        />
        <app-button
            [type]="'submit'"
        >
            Search
        </app-button>
    </form>
    <app-tabs
        [items]="headerTabs"
    />
</header>
