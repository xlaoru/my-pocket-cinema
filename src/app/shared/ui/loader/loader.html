<svg class="reel" viewBox="0 0 48 48" aria-hidden="true">
    <circle class="reel-rim" cx="24" cy="24" r="21" />
    @for (angle of holes; track angle) {
        <circle
            class="reel-hole"
            cx="24"
            cy="11"
            r="5"
            [attr.transform]="'rotate(' + angle + ' 24 24)'"
        />
    }
    <circle class="reel-hub" cx="24" cy="24" r="3" />
</svg>

@if (label()) {
    <span class="label">{{ label() }}</span>
} @else {
    <span class="visually-hidden">Loading</span>
}
